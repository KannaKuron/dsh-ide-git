name: ci

# Lightweight checks only: the smoke test is file-level (no Cordis runtime, no
# browser). npm publishing is intentionally NOT wired up in this repo yet —
# packaging/registry work lands after the feature set stabilises.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Smoke test
        run: npm test
